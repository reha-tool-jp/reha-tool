    const bval = btn.dataset.val;

    btn.className = "choice-btn" + (s === bval ? " sel-" + bval : "");

  });

  const nonexBtn = document.getElementById("nonex-" + idx);

  if (nonexBtn) nonexBtn.className = "nonex-btn" + (s === "nonex" ? " active" : "");

}



function resetAll() {

  if (!confirm("縺吶∋縺ｦ縺ｮ蜈･蜉帙ｒ繝ｪ繧ｻ繝・ヨ縺励∪縺吶°・・)) return;

  state = allItems.map(() => null);

  ["user-name","user-age","user-sex","eval-date","free-memo"].forEach(id => { const el = document.getElementById(id); if(el) el.value = ""; });

  updateSummary();

  // 蜈ｨ鬆・岼繧偵ヵ繝ｩ繝・ヨ蛹悶＠縺ｦ2蛻励ユ繝ｼ繝悶Ν縺ｧ蜃ｺ蜉・

  let printItems = [];

  let rows = []; // { type: 'header'|'item', cat, name, idx }

  let i = 0;

      i++;

    } else {

      // item陦鯉ｼ壼ｷｦ蜿ｳ2蛻励・繧｢

      const left = row;

      const right = (i+1 < rows.length && rows[i+1].type === 'item') ? rows[i+1] : null;



      const sl = state[left.idx];

      const ldoing    = sl === "doing"    ? '<span class="pt-circle">笳・/span>' : "";

      const lwant     = sl === "want"     ? '<span class="pt-circle">笳・/span>' : "";

      const linterest = sl === "interest" ? '<span class="pt-circle">笳・/span>' : "";



      let rightCells = "";

      if (right) {

        const sr = state[right.idx];

        const rdoing    = sr === "doing"    ? '<span class="pt-circle">笳・/span>' : "";

        const rwant     = sr === "want"     ? '<span class="pt-circle">笳・/span>' : "";

        const rinterest = sr === "interest" ? '<span class="pt-circle">笳・/span>' : "";

        rightCells = `<td style="width:2%;background:#e0e0e0;border:1px solid #000;"></td>

          <td class="pt-item-name" style="width:26%">${right.name}</td>

          <td class="pt-check" style="width:8%">${rdoing}</td>

          <td class="pt-check" style="width:8%">${rwant}</td>

          <td class="pt-check" style="width:8%">${rinterest}</td>`;

        i += 2;

      } else {

        rightCells = `<td style="background:#e0e0e0;border:1px solid #000;"></td><td colspan="4" style="border:1px solid #000;"></td>`;

        i++;

      }



      tablesHtml += `<tr>

        <td class="pt-item-name" style="width:26%">${left.name}</td>

        <td class="pt-check" style="width:8%">${ldoing}</td>

        <td class="pt-check" style="width:8%">${lwant}</td>

        <td class="pt-check" style="width:8%">${linterest}</td>

        ${rightCells}

      </tr>`;

    }

  }



  tablesHtml += `</tbody></table>`;



  // 閾ｪ逕ｱ險伜・谺・

  const freeMemo = getFreeMemo().replace(/\n/g, "<br>");

  const freeHtml = `<div class="pt-free"><div class="pt-free-label">縺昴・莉悶・迚ｹ險倅ｺ矩・/div>${freeMemo}</div>`;



  return `<div id="print-overlay">

    ${css}

    <div class="pt-title-block">

function printPage() {

  const old = document.getElementById("print-overlay");

  if (old) old.remove();

  const div = document.createElement("div");

  div.innerHTML = buildPrintDOM();

  document.body.appendChild(div.firstElementChild);

  window.print();

  setTimeout(() => { const o = document.getElementById("print-overlay"); if(o) o.remove(); }, 1500);

}



function render() {

  const c = document.getElementById("items-container");

  let html = "";

  let flatIdx = 0;

  CATEGORIES.forEach(cat => {

    html += "<div class=\"cat-label\"><span class=\"cat-icon\">" + cat.icon + "</span>" + cat.title + "</div>";

    html += "<div class=\"items-grid\">";

    cat.items.forEach(name => {

      const i = flatIdx;

      const s = state[i];

      const statusCls = s ? " status-" + (s === "nonex" ? "none-x" : s) : "";

      html += "<div class=\"item-card" + statusCls + "\" id=\"card-" + i + "\">";

      html += "<div class=\"item-name\">" + name + "</div>";

      html += "<div class=\"choice-row\">";

      [

        { val: "doing",    label: "縺励※縺・ｋ" },

        { val: "want",     label: "縺励※縺ｿ縺溘＞" },

        { val: "interest", label: "闊亥袖縺後≠繧・ },

      ].forEach(ch => {

        const selCls = s === ch.val ? " sel-" + ch.val : "";

        html += "<button class=\"choice-btn" + selCls + "\" data-idx=\"" + i + "\" data-val=\"" + ch.val + "\" onclick=\"select(" + i + ",'" + ch.val + "')\">"+ch.label+"</button>";

      });

      html += "</div>";

      html += "<div class=\"nonex-row\">";

      html += "<button class=\"nonex-btn" + (s === "nonex" ? " active" : "") + "\" id=\"nonex-" + i + "\" onclick=\"select(" + i + ",'nonex')\">ﾃ・隧ｲ蠖薙↑縺・/button>";

      html += "</div></div>";

      flatIdx++;

    });

    html += "</div>";

  });

  c.innerHTML = html;

}
